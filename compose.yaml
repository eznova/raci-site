services:
  raci-site:
    image: nginx:stable-alpine
    container_name: raci-site
    restart: unless-stopped
    ports:
      - "8064:80"
    volumes:
      - ./site:/var/www/html:ro
      - ./nginx:/etc/nginx/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - moc


networks:
  moc:
    external: true

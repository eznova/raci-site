server {
    listen 80;
    server_name _;

    root /var/www/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Files retain their names between releases: revalidate each request.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
